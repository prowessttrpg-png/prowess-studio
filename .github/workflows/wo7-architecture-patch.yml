name: WO7 temporary architecture patch helper

on:
  push:
    branches: [m5-wo7]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5-wo7
          fetch-depth: 0
      - name: Apply WO7 architecture metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          guards = [
            'packages/prowess-game/src/effect-golden.test.ts',
            'packages/prowess-game/src/effect-contracts.test.ts',
            'apps/studio/tests/unit/m5-wo7-static.test.ts',
            'scripts/m5-wo7-negative-controls.mjs',
          ]
          titles = {
            179:'Projectile Targeting Has A Listed Base Cost Of Three MP And Uses The Caster Current Applicable Range',
            180:'Projectile Requires A Ranged Attack Roll For Delivery; This Delivery Check Is Distinct From The Effect Mechanical Outcome And Any Effect-Owned Saving Throw',
            181:'When A Projectile-Delivered Effect Uses Attack-Roll Resolution, The Projectile Delivery Attack Is The Effect Attack And Is Never Rolled Twice',
            182:'When A Projectile-Delivered Effect Uses Saving-Throw Resolution, Successful Projectile Delivery Occurs Before The Effect-Owned Saving Throw',
            183:'Canonical Spell Line Length Equals Ten Feet Times PRO',
            184:'Canonical Spell Line Width Equals Five Feet Times The Ceiling Of PRO Divided By Two',
            185:'Effects Define What An Ability Does While Targeting Defines Delivery And Geometry; Targeting Never Owns Effect Outcomes',
            186:'Saving Throw Identity And Save Profiles Are Effect-Owned Mechanics And Are Never Inferred From Targeting Geometry',
            187:'SPELL_EFFECT And MANEUVER_EFFECT Are Separate Exact Definition Families That Share A Structural Effect Contract But Are Never Interchangeable',
            188:'The Seven Canonical Top-Level Spell Effect Families Are Damage, Healing, Buff, Debuff, Control, Utility And Summoning',
            189:'Cleanse Is A Healing Subfamily And Movement Is A Utility Subfamily; Neither Is A Separate Top-Level Spell Effect Family',
            190:'Spell Interference Is A Utility Mechanic Rather Than A Top-Level Spell Effect Family',
            191:'An Executable Canonical Spell Effect Must Explicitly Define Its Resolution Mode And Mechanical Outcome Metadata',
            192:'A Maneuver Effect May Inherit The Maneuver Existing Resolution Only Through An Explicit Inherit-Ability Resolution Policy',
            193:'Effect Saving-Throw Resolution Carries An Exact Authored Save Profile Or Exact Save-Selection Rule',
            194:'Effect Targeting Compatibility Uses Exact Structured Identity Or Explicit Semantic Compatibility And Never Fuzzy Text Matching',
            195:'Damage And Healing Character Dice Limits Apply Per Effect And Normally Cannot Exceed The Caster PRO',
            196:'Effects Never Gain Secondary Mechanical Outcomes Merely From Flavor, Damage Type, Keywords Or Display Text',
            197:'Effect Scaling Is Available Only Through Explicit Structured Scaling Rules And Parameters',
            198:'Effect Listed AP And MP Contributions Are Construction Costs And Never Runtime Resource Payment',
            199:'Mana Efficiency Never Changes An Effect Listed MP Cost',
            200:'Effect Access And Prerequisites Reuse The Existing Structured Ability Construction Requirement System',
            201:'Effect Stackability And Stack Limits Reuse WO5 Explicit Definition-Owned Stack Contract',
            202:'Effect Duration Metadata Describes Compatibility And Defaults; The Ability Actual Duration Remains A Separate Component',
            203:'Maneuver Targeting Conversion Is Owned By MANEUVER_EFFECT Definitions That Carry The Conversion Cost, Save Profile And Destination Targeting Reference',
            204:'Maneuver Targeting Definitions Never Duplicate Conversion Effect Costs Or Save Profiles',
            205:'Elemental Damage Conversion Changes Damage Type Only And Never Applies Unauthored Secondary Conditions',
            206:'Maneuver Damage Normally Comes From Its Foundation Or Weapon Unless An Exact Maneuver Effect Explicitly Replaces That Source',
            207:'Spell And Maneuver Effect Cost Contributions Are Not Combined Into Final Ability Cost During WO7',
            208:'WO7 Does Not Execute Effect Chains, Runtime Damage, Healing, Conditions, Movement Or Resource Mutation',
            209:'Effect Definitions Preserve Exact EntityVersion, Ruleset, Compatibility, Access, Keyword And Cost Provenance',
            210:'Historical Effect Evaluation Never Resolves Through Latest Or Current Content',
            211:'Effect Validation And Compilation Use Existing M4 Formula, Requirement And Keyword Primitives Rather Than Reimplementing Generic Rule Evaluation',
            212:'Effect Evaluation Is Deterministic, Immutable, JSON-Safe And Free Of Global Mutable Effect State',
          }

          # JSON invariant catalog.
          jp = Path('docs/architecture/m5-invariants.json')
          catalog = json.loads(jp.read_text())
          by = {e['id']:e for e in catalog}
          supersede = {'M5-I160':'M5-I180','M5-I163':'M5-I179','M5-I167':'M5-I183'}
          for old,new in supersede.items():
            by[old]['status']='SUPERSEDED'
            by[old]['supersededBy']=new
          if not any(e['id']=='M5-I179' for e in catalog):
            for i in range(179,213):
              catalog.append({'id':f'M5-I{i:03d}','title':titles[i],'group':'Effect Framework','status':'ACTIVE','guards':guards})
          jp.write_text(json.dumps(catalog, indent=2)+'\n')

          # Markdown invariant append + supersession notices.
          mp = Path('docs/architecture/m5-invariants.md')
          md = mp.read_text()
          for old,new in supersede.items():
            pattern = rf'(### {old}[^\n]*\n)'
            repl = rf'\1\n- **Status:** `SUPERSEDED` by `{new}` for current canon. Historical Releases remain reproducible.\n'
            if f'**Status:** `SUPERSEDED` by `{new}`' not in md:
              md = re.sub(pattern, repl, md, count=1)
          if '### M5-I179' not in md:
            blocks=[]
            meanings={
              179:'Projectile current canon is 3 MP and reads the existing applicable caster Range rather than hard-coding a second range formula.',
              180:'Projectile owns a Ranged Attack delivery check only; Effect resolution and any Effect Save remain separate Effect data.',
              181:'An ATTACK_ROLL Effect delivered by Projectile reuses the delivery attack and never creates a second roll.',
              182:'A SAVING_THROW Effect delivered by Projectile resolves delivery first and the Effect-owned Save only after a hit.',
              183:'Current Spell Line length is the M4 Formula 10 × PRO feet.',
              184:'Current Spell Line width is the M4 Formula 5 × ceil(PRO / 2) feet, minimum 5 feet.',
              185:'Targeting owns delivery/geometry; Effect owns mechanical outcome.',
              186:'Save identity/profile belongs to Effects, never Targeting geometry.',
              187:'Spell and Maneuver Effect Definition families share structure but cannot cross branches.',
              188:'Only Damage, Healing, Buff, Debuff, Control, Utility and Summoning are top-level Spell Effect families.',
              189:'Cleanse is HEALING/CLEANSE and Movement is UTILITY/MOVEMENT.',
              190:'Counterspell/Dispel-style Spell Interference is a Utility mechanic, not a top-level family.',
              191:'Executable Spell Effects author an explicit resolution and structured outcomes.',
              192:'Null Maneuver Effect resolution means inheritance only when INHERIT_ABILITY is explicitly authored.',
              193:'Saving-throw Effects author exact valid Saves and selection policy.',
              194:'Effect/Targeting compatibility uses exact identity/semantic tokens, never fuzzy text.',
              195:'Damage/Healing Character Dice selection is checked against PRO independently per Effect.',
              196:'Flavor, damage type and Keywords never create unauthored secondary mechanics.',
              197:'Only explicit parameters/formulas expose Effect scaling.',
              198:'Effect AP/MP values are listed construction contributions, not runtime payment.',
              199:'ME is payment-time state and never rewrites listed Effect MP.',
              200:'Effect access compiles through existing structured Ability Construction requirements.',
              201:'Effect stackability/limits reuse the WO5 Definition-owned stack contract.',
              202:'Effect Duration data is compatibility/default metadata; composition owns actual Duration.',
              203:'Maneuver Targeting Conversion Effects own conversion cost, Save Profile and exact destination Targeting ref.',
              204:'Destination Maneuver Targeting Definitions do not duplicate conversion cost/Save.',
              205:'Elemental conversion changes damage type only and creates no implicit Condition.',
              206:'Maneuver Foundation/weapon remains the damage source unless an exact Effect replaces it.',
              207:'WO7 never assembles complete Spell or Maneuver cost.',
              208:'WO7 validates/compiles Effect metadata only; no chain or runtime state mutation occurs.',
              209:'Effect evaluation pins exact EntityVersion, Ruleset, compatibility, access, Keywords and listed costs.',
              210:'Historical Effect evaluation never resolves through newest/current content.',
              211:'Effect rules compile into existing generic M4 Formula, Requirement and Keyword primitives.',
              212:'Equal exact inputs are deterministic; inputs remain immutable; public contracts are JSON-safe and no global Effect state exists.',
            }
            for i in range(179,213):
              blocks.append(f'### M5-I{i:03d} — {titles[i]}\n\n- **Group:** Effect Framework\n- **Meaning:** {meanings[i]}\n- **Guards:** `packages/prowess-game/src/effect-golden.test.ts`, `packages/prowess-game/src/effect-contracts.test.ts`, `apps/studio/tests/unit/m5-wo7-static.test.ts`, `scripts/m5-wo7-negative-controls.mjs`\n')
            md += '\n\n'+'\n'.join(blocks)
          mp.write_text(md)

          # Conflict register: preserve WO6 history in notes, then resolve current canon.
          cp=Path('docs/architecture/m5-core-playtest-source-conflicts.md')
          c=cp.read_text()
          s39='### M5-SC-039 — Projectile Base MP Cost'
          s40='### M5-SC-040 — Spell Line Width Rounding / Minimum'
          def section_replace(text, start, end, additions):
            a=text.index(start); b=text.find(end,a) if end else len(text); sec=text[a:b]
            sec=sec.replace('- **status**: `UNRESOLVED`\n- **resolution authority**: none', '- **status**: `RESOLVED_BY_DESIGNER`\n- **resolution authority**: M5-WO7 post-WO6 designer ruling')
            if additions not in sec: sec += '\n'+additions+'\n\n'
            return text[:a]+sec+text[b:]
          add39='- **M5-WO7 resolution**: Projectile Targeting costs exactly **3 MP**, uses the caster current applicable Range, and requires a **Ranged Attack Roll** delivery check. The delivery check is distinct from Effect outcome; an ATTACK_ROLL Effect reuses the same roll, while a SAVING_THROW Effect resolves its Effect-owned Save only after delivery hits.'
          add40='- **M5-WO7 resolution**: current Spell Line length is **10 ft × PRO** and width is **5 ft × ceil(PRO / 2)**. WO6 historical Releases preserve their earlier 15×PRO/deferred-width assumptions; current canon does not mutate them.'
          c=section_replace(c,s39,s40,add39)
          c=section_replace(c,s40,None,add40)
          cp.write_text(c)

          # Public exports: append once.
          ip=Path('packages/prowess-game/src/index.ts')
          idx=ip.read_text()
          marker='// ---- M5-WO7 Effect framework, resolution contracts & Effect Definitions ----'
          if marker not in idx:
            idx += f'''\n\n{marker}\nexport {{\n  SPELL_EFFECT_FAMILIES, EFFECT_SUBFAMILIES, EFFECT_RESOLUTION_POLICIES, EFFECT_ATTACK_TYPES,\n  EFFECT_SAVE_SELECTION_POLICIES, EFFECT_PARAMETER_KINDS, EFFECT_LIMIT_KINDS, EFFECT_VARIABLE_SOURCE_KINDS,\n  EFFECT_COST_KINDS, EFFECT_OUTCOME_KEYS, EFFECT_OUTCOME_OPERATIONS, TARGETING_DELIVERY_CHECKS,\n  EFFECT_DELIVERY_INTERACTIONS,\n  type SpellEffectFamily, type EffectSubfamily, type EffectResolutionPolicy, type EffectAttackType,\n  type EffectSaveSelectionPolicy, type EffectParameterKind, type EffectLimitKind, type EffectVariableSourceKind,\n  type EffectCostKind, type EffectOutcomeKey, type EffectOutcomeOperation, type TargetingDeliveryCheck,\n  type EffectDeliveryInteraction,\n}} from "./vocabulary/effect.js";\nexport {{ EFFECT_ERROR_CODES, isSpellEffectFamily, type EffectRules, type EffectParameterRule, type EffectFormula, type EffectSaveProfile, type EffectDurationPolicy, type EffectCostRule, type EffectOutcomeReading, type TargetingDeliveryRule }} from "./definition/effect-payload.js";\nexport {{ compileEffectUse, validateEffectUse, readEffectRun, type EffectCharacterContext, type EffectUseRequest, type EffectUseResult, type EffectCompiledOutputs, type ProwessEffectCompiledPlan }} from "./effect/compile.js";\n'''
            ip.write_text(idx)

          # WO6 permanent audit now understands exact supersession without rewriting history.
          wp=Path('apps/studio/tests/unit/m5-wo6-static.test.ts')
          w=wp.read_text()
          old='expect(entry.status ?? "ACTIVE", entry.id).toBe("ACTIVE");'
          new='expect(entry.status ?? "ACTIVE", entry.id).toBe(["M5-I160", "M5-I163", "M5-I167"].includes(entry.id) ? "SUPERSEDED" : "ACTIVE");'
          if old in w: w=w.replace(old,new,1)
          wp.write_text(w)
          PY
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/architecture/m5-invariants.json docs/architecture/m5-invariants.md docs/architecture/m5-core-playtest-source-conflicts.md packages/prowess-game/src/index.ts apps/studio/tests/unit/m5-wo6-static.test.ts
          git commit -m 'M5-WO7: register invariants supersessions exports and conflict rulings'
          git push origin HEAD:m5-wo7
