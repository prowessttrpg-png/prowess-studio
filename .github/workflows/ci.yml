  # ---- Production build + browser (Tier 2) ----------------------------------------------------------------------------
  e2e:
    name: Build (production) + end-to-end (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_URL: http://127.0.0.1:3100
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prowess_studio_test
      LOG_LEVEL: warn
      DEVELOPMENT_MODE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        if: env.CERTIFICATION != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Set up Node.js (Tier 3 — no dependency cache)
        if: env.CERTIFICATION == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create test database
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready -h localhost -p 5432 -U postgres > /dev/null 2>&1; do sleep 2; done
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE prowess_studio_test;"
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Prisma Client generation and test-database migrations
        env:
          NODE_ENV: test
        run: |
          pnpm run db:generate
          pnpm run db:migrate:deploy
      # Browser binaries are cached per exact Playwright version (a performance aid; Tier 3 never restores it). The OS
      # dependencies are always installed.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./apps/studio/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: browsers
        if: env.CERTIFICATION != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter "@prowess/studio" exec playwright install --with-deps chromium
      - name: Install Playwright OS dependencies (cached browsers)
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter "@prowess/studio" exec playwright install-deps chromium
      - name: Restore Next.js build cache
        if: env.CERTIFICATION != 'true'
        uses: actions/cache@v4
        with:
          path: apps/studio/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      # The one production build of this commit (all workspace packages, then Next.js): a clearly attributed failure if
      # the build breaks, and the exact artifact Playwright serves below.
      - name: Build (production)
        run: pnpm build
      # PROWESS_E2E_PREBUILT=1: Playwright's webServer serves the build above (`next start`) instead of building the
      # same commit a second time; it refuses to start without that build's BUILD_ID.
      - name: End-to-end tests (Playwright)
        env:
          PROWESS_E2E_PREBUILT: "1"
        run: pnpm run test:e2e

  # ---- Tier summaries ---------------------------------------------------------------------------------------------------
  tier-1:
    name: Tier 1 — fast feedback
    if: always()
    needs: [static, unit-packages, unit-game, unit-studio]
    runs-on: ubuntu-latest
    steps:
      # The summary script lives in the repository: a summary job checks out just scripts/ci (no install, no build).
      - name: Checkout (scripts/ci only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
      - name: Every Tier 1 job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/require-success.mjs

  tier-2:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.certification && 'Tier 3 — clean certification' || 'Tier 2 — merge readiness' }}
    if: always()
    needs: [static, unit-packages, unit-game, unit-studio, db-api, db-integration, controls-1, controls-2, controls-3, controls-4, controls-5, controls-6, e2e]
    runs-on: ubuntu-latest
    steps:
      # The summary script lives in the repository: a summary job checks out just scripts/ci (no install, no build).
      - name: Checkout (scripts/ci only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/require-success.mjs
