# Prowess Studio CI — the permanent quality gate (restructured in M5-CLOSEOUT-03).
#
# One workflow, one deliberate job graph (docs/architecture/ci.md, docs/reports/m0-m5-ci-optimization-report.md):
#
#   static ─────────┐
#   unit-packages ──┤  Tier 1 — fast feedback (lint, architecture, typecheck, every package / Studio unit suite)
#   unit-game ──────┤
#   unit-studio ────┤
#   db-api ─────────┤  Prisma validate / generate / migrate / drift, API integration, test-database guards
#   db-integration ─┤  database integration, two shards on two independent PostgreSQL services
#                   └─► controls-1 … controls-6  every named M1 / M4 / M5 gate: verified from THIS run's authoritative
#                                                 suite reports, then its negative / mutation controls (each job is its
#                                                 own checkout, so no two controls ever mutate the same files)
#   e2e                Next.js production build once → Playwright against that build
#   tier-1 / tier-2    summaries: Tier 1 needs the fast jobs, Tier 2 (merge readiness) needs every job
#
# Every suite runs ONCE per run and writes a vitest JSON report; gates verify their files from those reports
# (scripts/ci/verify-gate.mjs) instead of re-running them. The permanent inventory of suites, gates, controls and
# checks is scripts/ci/gates.json; apps/studio/tests/unit/ci-gate-inventory.test.ts proves it matches this file and
# covers everything the pre-CLOSEOUT-03 workflows ran (scripts/ci/legacy-inventory.json).
#
# Tier 3 — clean certification: run this workflow manually with `certification: true` — no dependency, browser or
# Next.js cache is used. Each job has two explicit Node setup steps: the normal one (`cache: pnpm`) and the Tier 3 one
# (no cache input); every cache restore step runs only outside certification. scripts/ci/gate-inventory.mjs
# (checkCertificationCaches) enforces this — an expression such as `cache: ${{ cond && '' || 'pnpm' }}` always yields
# 'pnpm' and let Tier 3 attempt #226 restore the pnpm store. Pull-request runs superseded by a newer commit are cancelled; main and certification runs never
# are (each has its own concurrency group).
name: Prowess Studio CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      certification:
        description: "Tier 3 clean certification: no dependency / browser / Next.js caches"
        type: boolean
        default: false

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CERTIFICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.certification && 'true' || 'false' }}
  # Authoritative suite reports live OUTSIDE the checkout (scripts/ci/collect-reports.mjs moves them there), so no
  # static audit or control ever reads them as repository content.
  PROWESS_REPORTS_DIR: /tmp/prowess-reports

jobs:
  # ---- Tier 1 ---------------------------------------------------------------------------------------------------------
  static:
    name: Static — lint, architecture, typecheck, gate inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        if: env.CERTIFICATION != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Set up Node.js (Tier 3 — no dependency cache)
        if: env.CERTIFICATION == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # The generated Prisma Client is gitignored; @prowess/db cannot build (and nothing importing it can typecheck or
      # test) without it. Generation needs no database.
      - name: Prisma Client generation
        run: pnpm run db:generate
      - name: Build workspace packages
        run: pnpm --filter "@prowess/model" --filter "@prowess/ui" --filter "@prowess/import" --filter "@prowess/rules" --filter "@prowess/game" --filter "@prowess/db" run build
      - name: Lint
        run: pnpm lint
      - name: Architecture boundary checks
        run: pnpm run test:architecture
      - name: Typecheck
        run: pnpm typecheck
      - name: Gate inventory — every permanent gate, suite, control and legacy check represented
        run: node scripts/ci/gate-inventory.mjs
      - name: Control harness self-test — uncaught, misattributed and unrestored controls fail
        run: node scripts/lib/control-harness.selftest.mjs

  unit-packages:
    name: Unit — model, ui, import, rules, db
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        if: env.CERTIFICATION != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Set up Node.js (Tier 3 — no dependency cache)
        if: env.CERTIFICATION == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # The generated Prisma Client is gitignored; @prowess/db cannot build (and nothing importing it can typecheck or
      # test) without it. Generation needs no database.
      - name: Prisma Client generation
        run: pnpm run db:generate
      - name: Build workspace packages
        run: pnpm --filter "@prowess/model" --filter "@prowess/ui" --filter "@prowess/import" --filter "@prowess/rules" --filter "@prowess/game" --filter "@prowess/db" run build
      # The independent package suites run concurrently on the runner's cores; each writes its own JSON report.
      - name: Unit tests (packages)
        run: pnpm --workspace-concurrency=4 --filter "@prowess/model" --filter "@prowess/ui" --filter "@prowess/import" --filter "@prowess/rules" --filter "@prowess/db" run test:unit --reporter=default --reporter=json --outputFile.json=vitest-report.json
      - name: Collect authoritative reports
        run: node scripts/ci/collect-reports.mjs model-unit ui-unit import-unit rules-unit db-unit
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: reports-unit-packages
          path: /tmp/prowess-reports/
          if-no-files-found: error
          retention-days: 7

  unit-game:
    name: Unit — @prowess/game
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        if: env.CERTIFICATION != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Set up Node.js (Tier 3 — no dependency cache)
        if: env.CERTIFICATION == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # The generated Prisma Client is gitignored; @prowess/db cannot build (and nothing importing it can typecheck or
      # test) without it. Generation needs no database.
      - name: Prisma Client generation
        run: pnpm run db:generate
      - name: Build workspace packages
        run: pnpm --filter "@prowess/model" --filter "@prowess/ui" --filter "@prowess/import" --filter "@prowess/rules" --filter "@prowess/game" --filter "@prowess/db" run build
      - name: Unit tests (@prowess/game)
        run: pnpm --filter "@prowess/game" run test:unit --reporter=default --reporter=json --outputFile.json=vitest-report.json
      - name: Collect authoritative reports
        run: node scripts/ci/collect-reports.mjs game-unit
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: reports-unit-game
          path: /tmp/prowess-reports/
          if-no-files-found: error
          retention-days: 7

  unit-studio:
    name: Unit — Studio UI / component / static audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        if: env.CERTIFICATION != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Set up Node.js (Tier 3 — no dependency cache)
        if: env.CERTIFICATION == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # The generated Prisma Client is gitignored; @prowess/db cannot build (and nothing importing it can typecheck or
      # test) without it. Generation needs no database.
      - name: Prisma Client generation
        run: pnpm run db:generate
      - name: Build workspace packages
        run: pnpm --filter "@prowess/model" --filter "@prowess/ui" --filter "@prowess/import" --filter "@prowess/rules" --filter "@prowess/game" --filter "@prowess/db" run build
      - name: UI/component tests (apps/studio)
        run: pnpm --filter "@prowess/studio" run test:unit --reporter=default --reporter=json --outputFile.json=vitest-report.json
      - name: Collect authoritative reports
        run: node scripts/ci/collect-reports.mjs studio-unit
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: reports-unit-studio
          path: /tmp/prowess-reports/
          if-no-files-found: error
          retention-days: 7

  # ---- Database / API (Tier 2) ----------------------------------------------------------------------------------------
  db-api:
    name: Database — Prisma checks, API integration, test-database guards
    runs-on: ubuntu-latest
    # Postgres 16 as a disposable service container, scoped to this one job run: isolated, never shared with another
    # job, created fresh every run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        if: env.CERTIFICATION != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Set up Node.js (Tier 3 — no dependency cache)
        if: env.CERTIFICATION == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wait for PostgreSQL to be ready
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres > /dev/null 2>&1; then
              echo "PostgreSQL is accepting connections."
              exit 0
            fi
            echo "Waiting for PostgreSQL... (attempt $i/30)"
            sleep 2
          done
          echo "::error::PostgreSQL did not become ready in time."
          exit 1
      # Two isolated, disposable databases — the names apps/studio/.env.development / .env.test commit to (M0-WO2).
      - name: Create dev and test databases
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE prowess_studio_dev;"
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE prowess_studio_test;"
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Prisma schema validation
        run: pnpm run db:validate
      - name: Prisma Client generation
        run: pnpm run db:generate
      - name: Deploy migrations (development database)
        env:
          NODE_ENV: development
        run: pnpm run db:migrate:deploy
      - name: Deploy migrations (test database)
        env:
          NODE_ENV: test
        run: pnpm run db:migrate:deploy

      # M1-WO11 §28: schema drift check — a REQUIRED gate. Compares the database produced by `migrate deploy` (above)
      # against schema.prisma using Prisma's own non-interactive diff (no shadow database, no `migrate dev`). Prisma exit
      # codes: 0 = no differences, 2 = differences, 1 = the command itself failed. ANY non-zero exit fails CI, and the
      # full diff is printed unfiltered (and repeated in the job summary). Prisma is invoked directly rather than via
      # `pnpm --filter ... exec` so real drift (exit 2) is reported as drift (audit F-14).
      - name: Schema drift check — migrations vs schema.prisma (blocking)
        working-directory: packages/prowess-db
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prowess_studio_test
        run: |
          set +e
          ./node_modules/.bin/prisma migrate diff \
            --from-config-datasource --to-schema prisma/schema.prisma --exit-code \
            2>&1 | tee /tmp/prisma-drift.txt
          code=${PIPESTATUS[0]}
          set -e
          {
            echo "### Prisma schema drift check (migrations vs schema.prisma)"
            if [ "$code" -eq 0 ]; then
              echo "**No differences.** The migration history reconstructs exactly the schema Prisma expects."
            elif [ "$code" -eq 2 ]; then
              echo "**DRIFT DETECTED (exit 2)** — the migrations and schema.prisma disagree. Full, unfiltered output:"
              echo '```'; cat /tmp/prisma-drift.txt; echo '```'
            else
              echo "**The diff command failed (exit $code)** — this is not a clean result. Output:"
              echo '```'; cat /tmp/prisma-drift.txt; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      # Workspace packages are built before anything resolves their compiled declarations.
      - name: Build workspace packages
        run: pnpm --filter "@prowess/model" --filter "@prowess/ui" --filter "@prowess/import" --filter "@prowess/rules" --filter "@prowess/game" --filter "@prowess/db" run build
      # M1-WO8: API route-handler tests, calling each Next.js route handler directly against prowess_studio_test.
      - name: API integration tests (apps/studio)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prowess_studio_test
        run: pnpm --filter "@prowess/studio" run test:integration --reporter=default --reporter=json --outputFile.json=vitest-report.integration.json
      - name: Collect authoritative reports
        run: node scripts/ci/collect-reports.mjs studio-integration
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: reports-db-api
          path: /tmp/prowess-reports/
          if-no-files-found: error
          retention-days: 7
      # Re-confirms the destructive-reset safety guard on every run — this resets prowess_studio_test, the disposable
      # CI-only database created above, never a developer's own database.
      - name: Guarded reset of the test database
        run: pnpm run db:reset:test
      - name: Verify safety guard refuses a non-test target
        run: |
          set +e
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/prowess_studio_dev" pnpm run db:reset:test
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::db:reset:test unexpectedly succeeded against the development database — the safety guard failed to refuse it."
            exit 1
          fi
          echo "Safety guard correctly refused (exit code $status), as expected."

  db-integration:
    name: Database integration (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Each shard has its OWN disposable PostgreSQL service: no database is shared between concurrent jobs.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        if: env.CERTIFICATION != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Set up Node.js (Tier 3 — no dependency cache)
        if: env.CERTIFICATION == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Both databases, as the pre-CLOSEOUT-03 job had them: the integration suite also proves dev/test isolation
      # (data written through the test client never appears in prowess_studio_dev), which needs a migrated dev database.
      - name: Create dev and test databases
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready -h localhost -p 5432 -U postgres > /dev/null 2>&1; do sleep 2; done
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE prowess_studio_dev;"
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE prowess_studio_test;"
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Prisma Client generation
        run: pnpm run db:generate
      - name: Deploy migrations (development database)
        env:
          NODE_ENV: development
        run: pnpm run db:migrate:deploy
      - name: Deploy migrations (test database)
        env:
          NODE_ENV: test
        run: pnpm run db:migrate:deploy
      - name: Build workspace packages
        run: pnpm --filter "@prowess/model" --filter "@prowess/ui" --filter "@prowess/import" --filter "@prowess/rules" --filter "@prowess/game" --filter "@prowess/db" run build
      - name: Database integration tests
        run: pnpm --filter "@prowess/db" run test:integration --shard=${{ matrix.shard }}/2 --reporter=default --reporter=json --outputFile.json=vitest-report.integration.json
      - name: Collect authoritative reports
        env:
          PROWESS_SHARD: ${{ matrix.shard }}
        run: node scripts/ci/collect-reports.mjs db-integration
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: reports-db-integration-${{ matrix.shard }}
          path: /tmp/prowess-reports/
          if-no-files-found: error
          retention-days: 7

  # ---- Named permanent gates + controls (Tier 2) ----------------------------------------------------------------------
  # Each gate step first verifies, from this run's authoritative suite reports, that every file of the gate passed
  # (scripts/ci/verify-gate.mjs — the list is cross-checked against scripts/ci/gates.json), then runs the gate's own
  # negative / mutation controls with the exact inventory count. Every controls job is a separate checkout.
  controls-1:
    name: Gates — M1, M4, M5-WO1…WO3
    needs: [unit-packages, unit-game, unit-studio, db-api, db-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        if: env.CERTIFICATION != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Set up Node.js (Tier 3 — no dependency cache)
        if: env.CERTIFICATION == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # The generated Prisma Client is gitignored; @prowess/db cannot build (and nothing importing it can typecheck or
      # test) without it. Generation needs no database.
      - name: Prisma Client generation
        run: pnpm run db:generate
      - name: Build workspace packages
        run: pnpm --filter "@prowess/model" --filter "@prowess/ui" --filter "@prowess/import" --filter "@prowess/rules" --filter "@prowess/game" --filter "@prowess/db" run build
      - name: Download authoritative reports
        uses: actions/download-artifact@v4
        with:
          pattern: reports-*
          path: /tmp/prowess-reports
          merge-multiple: true
      - name: M1 audit gate — static invariants (no current-version state, enum parity, errors, migrations, layering)
        run: node scripts/ci/verify-gate.mjs M1-STATIC apps/studio/tests/unit/m1-audit-static.test.ts
      - name: M1 audit gate — database-level suite
        run: node scripts/ci/verify-gate.mjs M1-DB packages/prowess-db/tests/integration/m1-audit.test.ts
      - name: M1 audit gate — API-level reproducibility suite
        run: node scripts/ci/verify-gate.mjs M1-API apps/studio/tests/integration/m1-audit-api.test.ts
      - name: M4-WO1 audit gate — Rules Engine boundaries & purity (static)
        run: node scripts/ci/verify-gate.mjs M4-WO1 apps/studio/tests/unit/m4-wo1-static.test.ts
      - name: M4-WO2 audit gate — exact Ruleset resolver (static)
        run: node scripts/ci/verify-gate.mjs M4-WO2-STATIC apps/studio/tests/unit/m4-wo2-static.test.ts
      - name: M4-WO2 audit gate — exact Ruleset resolver (database)
        run: node scripts/ci/verify-gate.mjs M4-WO2-DB packages/prowess-db/tests/integration/ruleset-context.test.ts
      - name: M4-WO3 audit gate — Formula Engine safety & determinism
        run: node scripts/ci/verify-gate.mjs M4-WO3 apps/studio/tests/unit/m4-wo3-static.test.ts
      - name: M4-WO4 audit gate — Keyword metadata & resolution (static)
        run: node scripts/ci/verify-gate.mjs M4-WO4-STATIC apps/studio/tests/unit/m4-wo4-static.test.ts
      - name: M4-WO4 audit gate — Keyword metadata & resolution (database)
        run: node scripts/ci/verify-gate.mjs M4-WO4-DB packages/prowess-db/tests/integration/m1-keyword-resolution.test.ts
      - name: M4-WO5 audit gate — Requirement evaluation & predicate safety
        run: node scripts/ci/verify-gate.mjs M4-WO5 apps/studio/tests/unit/m4-wo5-static.test.ts
      - name: M4-WO6 audit gate — Modifier ordering, stacking & safety
        run: node scripts/ci/verify-gate.mjs M4-WO6 apps/studio/tests/unit/m4-wo6-static.test.ts
      - name: M4-WO7 audit gate — Resource state, payment & capacity safety
        run: node scripts/ci/verify-gate.mjs M4-WO7 apps/studio/tests/unit/m4-wo7-static.test.ts
      - name: M4-WO8 audit gate — Validation aggregation & diagnostic safety
        run: node scripts/ci/verify-gate.mjs M4-WO8 apps/studio/tests/unit/m4-wo8-static.test.ts
      - name: M4-WO9 audit gate — Trace composition & explanation integrity
        run: node scripts/ci/verify-gate.mjs M4-WO9 apps/studio/tests/unit/m4-wo9-static.test.ts
      - name: M4-WO10 audit gate — Rules orchestration integrity
        run: node scripts/ci/verify-gate.mjs M4-WO10 apps/studio/tests/unit/m4-wo10-static.test.ts
      - name: M4-WO11 audit gate — Rules Inspector presentation integrity
        run: node scripts/ci/verify-gate.mjs M4-WO11 apps/studio/tests/unit/m4-wo11-static.test.ts apps/studio/tests/unit/m4-rules-api-client.test.ts apps/studio/tests/unit/m4-rules-lab.test.tsx
      - name: M4-WO10 integration gate — Exact Ruleset evaluation HTTP flow
        run: node scripts/ci/verify-gate.mjs M4-WO10-HTTP apps/studio/tests/integration/m4-rules-evaluation-api.test.ts
      - name: M4-WO12 final audit — M4 integration & reproducibility
        run: |
          node scripts/ci/verify-gate.mjs M4-WO12 apps/studio/tests/unit/m4-final-static.test.ts apps/studio/tests/unit/m4-final-engine.test.ts apps/studio/tests/unit/m4-final-ui.test.tsx apps/studio/tests/unit/m4-final-limits.test.ts apps/studio/tests/integration/m4-final-api.test.ts
          PROWESS_EXPECT_CONTROLS=3 node scripts/m4-final-negative-controls.mjs
      - name: M5-WO1 audit — Prowess domain & shared ability construction boundary
        run: |
          node scripts/ci/verify-gate.mjs M5-WO1 apps/studio/tests/unit/m5-wo1-static.test.ts packages/prowess-db/tests/unit/m5-source-terminology.test.ts packages/prowess-db/tests/integration/prowess-definition-materialization.test.ts
          PROWESS_EXPECT_CONTROLS=17 node scripts/m5-wo1-negative-controls.mjs
      - name: M5-WO2 audit — Core resolution, stats, dice & ranks
        run: |
          node scripts/ci/verify-gate.mjs M5-WO2 packages/prowess-game/src/core-resolution-golden.test.ts packages/prowess-game/src/core-contracts.test.ts apps/studio/tests/unit/m5-wo2-static.test.ts packages/prowess-db/tests/unit/m5-wo2-inspector-fixture.test.ts packages/prowess-db/tests/integration/prowess-core-resolution-history.test.ts apps/studio/tests/integration/m5-wo2-core-api.test.ts
          PROWESS_EXPECT_CONTROLS=18 node scripts/m5-wo2-negative-controls.mjs
