name: WO7 temporary CI patch helper

on:
  push:
    branches: [m5-wo7]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5-wo7
          fetch-depth: 0
      - name: Add permanent WO7 gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/ci.yml')
          s=p.read_text()
          if 'M5-WO7 audit — Effect framework & Spell/Maneuver contracts' not in s:
              anchor='          node scripts/m5-wo6-negative-controls.mjs\n\n'
              assert s.count(anchor)==1, 'WO6 CI anchor changed'
              block='''          node scripts/m5-wo6-negative-controls.mjs\n\n      # M5-WO7: Effect framework, Projectile delivery amendment, Spell Line amendment, structured Spell/Maneuver Effect\n      # contracts, exact access/compatibility/scaling/cost provenance, history/isolation, Rules Inspector fixtures,\n      # security, static architecture audit and behavioural negative controls. No runtime Effect execution occurs here.\n      - name: M5-WO7 audit — Effect framework & Spell/Maneuver contracts\n        run: |\n          pnpm --filter "@prowess/game" exec vitest run src/effect-golden.test.ts src/effect-contracts.test.ts src/effect-security.test.ts src/effect-inspector.test.ts\n          pnpm --filter "@prowess/studio" exec vitest run tests/unit/m5-wo7-static.test.ts\n          node scripts/m5-wo7-negative-controls.mjs\n\n'''
              s=s.replace(anchor,block,1)
              p.write_text(s)
          PY
      - name: Commit CI gate if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml
          git commit -m 'M5-WO7: add permanent Effect framework CI gate'
          git push origin HEAD:m5-wo7
