name: WO7 temporary UI diagnostics

on:
  push:
    branches: [m5-wo7]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5-wo7
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture Studio unit diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p tmp
          pnpm --filter '@prowess/model' --filter '@prowess/ui' --filter '@prowess/import' --filter '@prowess/rules' --filter '@prowess/game' --filter '@prowess/db' --filter '@prowess/test-fixtures' run build > tmp/wo7-ui-diagnostics.txt 2>&1
          echo '===== STUDIO UNIT =====' >> tmp/wo7-ui-diagnostics.txt
          pnpm --filter '@prowess/studio' run test:unit >> tmp/wo7-ui-diagnostics.txt 2>&1
          echo "EXIT=$?" >> tmp/wo7-ui-diagnostics.txt
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f tmp/wo7-ui-diagnostics.txt
          git commit -m 'chore: capture WO7 UI diagnostics'
          git push origin HEAD:m5-wo7
