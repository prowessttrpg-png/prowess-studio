name: DIST-WO2 P15 Windows backup restore
on:
  push:
    branches: [dist-wo2-p15-proof]
permissions:
  actions: read
  contents: read
env:
  SOURCE_RUN: '43776441758'
  CI_RUN: '43777171367'
  CI_INSTALLER: prowess-windows-x64-71b6bbf4d2a5fc01de2536d26b570c9d84f50bb1
jobs:
  package:
    name: Find the CI #280 candidate installer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      artifact: ${{ steps.installer.outputs.id }}
    steps:
      - id: installer
        name: Wait for the exact candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for (( attempt=0; attempt<40; attempt++ )); do
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN/artifacts?name=$CI_INSTALLER" --jq '.artifacts[0].id // empty')
            if [[ -n "$id" ]]; then
              echo "id=$id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          exit 1
  receiver:
    name: Windows B — restore CI #279 backup on fixed installer
    needs: package
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CI_INSTALLER }}
          run-id: ${{ env.CI_RUN }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/installer
      - uses: actions/download-artifact@v4
        with:
          name: p15-source-backup-and-baseline
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/input
      - name: Compare restore, restart and continued play through the installed app
        env:
          INSTALLER_ARTIFACT_ID: ${{ needs.package.outputs.artifact }}
        shell: pwsh
        run: ./scripts/distribution/p15/verify.ps1 -Artifact "$env:RUNNER_TEMP/installer" -InputDirectory "$env:RUNNER_TEMP/input" -Evidence "$env:RUNNER_TEMP/p15-receiver" -InstallerArtifactId $env:INSTALLER_ARTIFACT_ID
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p15-receiver-comparison
          path: ${{ runner.temp }}/p15-receiver
          if-no-files-found: warn
