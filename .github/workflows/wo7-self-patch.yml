name: WO7 temporary branch patch helper

on:
  push:
    branches: [m5-wo7]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5-wo7
          fetch-depth: 0
      - name: Apply narrow compile typing patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/prowess-game/src/effect/compile.ts')
          s = p.read_text()
          old = 'else if (v.source.kind === "PARAMETER") { const q = effectRules.parameters.find((x) => x.parameter === v.source.parameter)!; const x = parameterValue(q, params); if (typeof x !== "number") p.add(E.INVALID_EFFECT_RULES, ["composition", "effects", effectUse.componentKey, "parameters", v.source.parameter], `numeric ${v.source.parameter} required`); else variables[v.variable] = x; }'
          new = 'else if (v.source.kind === "PARAMETER") { const parameter = v.source.parameter; const q = effectRules.parameters.find((x) => x.parameter === parameter)!; const x = parameterValue(q, params); if (typeof x !== "number") p.add(E.INVALID_EFFECT_RULES, ["composition", "effects", effectUse.componentKey, "parameters", parameter], `numeric ${parameter} required`); else variables[v.variable] = x; }'
          if old not in s:
              print('Patch already applied or source changed; no-op.')
          else:
              p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/prowess-game/src/effect/compile.ts
          git commit -m 'M5-WO7: fix formula parameter narrowing'
          git push origin HEAD:m5-wo7
