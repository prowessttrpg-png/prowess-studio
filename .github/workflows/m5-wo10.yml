name: M5-WO10 audit — Final Spell Cost & AP Derivation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  m5-wo10:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Create test database and deploy migrations
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prowess_studio_test
        run: |
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE prowess_studio_test;"
          pnpm run db:generate
          pnpm run db:migrate:deploy
      - name: Build workspace packages
        run: pnpm run build
      - name: M5-WO10 audit — Final Spell Cost & AP Derivation
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prowess_studio_test
          APP_URL: http://127.0.0.1:3100
          LOG_LEVEL: warn
          DEVELOPMENT_MODE: "false"
        run: |
          node --input-type=module -e 'await import("./packages/prowess-game/dist/index.js")'
          pnpm --filter "@prowess/game" exec vitest run src/spell-cost-golden.test.ts src/spell-cost-contracts.test.ts
          pnpm --filter "@prowess/studio" exec vitest run tests/unit/m5-wo10-static.test.ts
          pnpm --filter "@prowess/db" exec vitest run --config vitest.unit.config.ts tests/unit/m5-wo10-inspector-fixture.test.ts
          pnpm --filter "@prowess/db" exec vitest run --config vitest.integration.config.ts tests/integration/prowess-spell-cost-history.test.ts
          pnpm --filter "@prowess/studio" exec vitest run --config vitest.integration.config.ts tests/integration/m5-wo10-spell-cost-api.test.ts
          node scripts/m5-wo10-negative-controls.mjs
