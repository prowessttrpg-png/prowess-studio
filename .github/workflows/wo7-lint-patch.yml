name: WO7 temporary lint patch helper

on:
  push:
    branches: [m5-wo7]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5-wo7
          fetch-depth: 0
      - name: Apply narrow lint patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/prowess-game/src/effect/compile.ts')
          s = p.read_text()
          old = 'export interface EffectCharacterContext extends AbilityConstructionCharacterContext {}'
          new = 'export type EffectCharacterContext = AbilityConstructionCharacterContext;'
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/prowess-game/src/effect/compile.ts
          git commit -m 'M5-WO7: satisfy strict Effect compiler lint'
          git push origin HEAD:m5-wo7
