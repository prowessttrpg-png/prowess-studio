name: WO7 temporary diagnostics

on:
  push:
    branches: [m5-wo7]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5-wo7
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p tmp
          : > tmp/wo7-diagnostics.txt
          run_cmd() {
            echo "===== $1 =====" >> tmp/wo7-diagnostics.txt
            shift
            "$@" >> tmp/wo7-diagnostics.txt 2>&1
            code=$?
            echo "EXIT=$code" >> tmp/wo7-diagnostics.txt
            echo >> tmp/wo7-diagnostics.txt
          }
          run_cmd 'MODEL BUILD' pnpm --filter '@prowess/model' run build
          run_cmd 'RULES BUILD' pnpm --filter '@prowess/rules' run build
          run_cmd 'GAME BUILD' pnpm --filter '@prowess/game' run build
          run_cmd 'GAME TESTS' pnpm --filter '@prowess/game' exec vitest run src/effect-golden.test.ts src/effect-contracts.test.ts src/effect-security.test.ts src/effect-inspector.test.ts
          run_cmd 'STUDIO STATIC' pnpm --filter '@prowess/studio' exec vitest run tests/unit/m5-wo7-static.test.ts
          run_cmd 'NEGATIVE CONTROLS' node scripts/m5-wo7-negative-controls.mjs
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f tmp/wo7-diagnostics.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: capture WO7 diagnostics'
          git push origin HEAD:m5-wo7
